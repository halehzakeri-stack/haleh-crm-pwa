function checkoutHtml(){const t=totals();return `<aside class="checkout card" id="checkout"><div class="checkout-head"><h2>فروش جاری</h2>${state.cart.length?'<button class="text-link" id="clearCart">پاک کردن</button>':''}</div><div class="cart">${state.cart.length?state.cart.map(cartLine).join(''):'<div class="empty-cart">یک کالا و سایز انتخاب کنید.</div>'}</div>${checkoutSections(t)}<div class="submit-wrap"><button class="btn btn-primary submit-sale" id="submitSale" ${!state.cart.length?'disabled':''}>${submitText(t)}</button><div class="microcopy">موجودی، سفارش، پرداخت و اقدام بعدی با همین ثبت به‌روزرسانی می‌شود.</div></div></aside>`}
function cartLine(i){const p=data.products.find(x=>x.id===i.pid),img=p?.image||PRODUCT_IMAGES[i.pid]||PRODUCT_IMAGES.h258;return `<div class="cart-line"><div class="mini-jeans"><img src="${img}" alt="${i.name}"></div><div><strong>${i.name}</strong><small>${i.color} · ${fmt(i.size)} · ${toman(i.price)}</small></div><div><div class="qty"><button type="button" data-qty="${i.key}|-1">−</button><span>${fmt(i.qty)}</span><button type="button" data-qty="${i.key}|1">+</button></div><button type="button" class="text-link" data-remove="${i.key}">حذف</button></div></div>`}
function checkoutSections(t){return `<div class="checkout-section"><div class="row-head"><div class="row-title"><div class="bubble"><span class="icon" data-icon="users"></span></div><div><strong>مشتری</strong><small>${state.delivery==='SHIP'?'برای ارسال الزامی است':'در فروش حضوری اختیاری'}</small></div></div><button class="text-link" id="chooseCustomer">${state.customer?'تغییر':'انتخاب'}</button></div>${state.customer?`<div class="selected-person"><div><strong>${state.customer.name}</strong><small class="ltr">${state.customer.phone}</small></div><button class="text-link" id="clearCustomer">حذف</button></div>`:''}</div>
${deliverySectionHtml()}
<div class="checkout-section"><div class="row-title"><div class="bubble"><span class="icon" data-icon="wallet"></span></div><div><strong>پرداخت</strong><small>${state.payment==='CARD_TRANSFER'?'پس از ثبت نیاز به تأیید دارد':'در فروش عادی خودکار ثبت می‌شود'}</small></div></div><div class="payment-options"><button data-pay="POS" class="${state.payment==='POS'?'active':''}">کارت‌خوان</button><button data-pay="CARD_TRANSFER" class="${state.payment==='CARD_TRANSFER'?'active':''}">کارت‌به‌کارت</button><button data-pay="CASH" class="${state.payment==='CASH'?'active':''}">نقدی</button><button data-pay="SPLIT" class="${state.payment==='SPLIT'?'active':''}">پرداخت ناقص / ترکیبی</button></div>${state.payment==='SPLIT'?`<input class="field" id="paidAmount" inputmode="numeric" placeholder="مبلغ دریافت‌شده" value="${state.paid??''}">`:''}${state.payment==='CARD_TRANSFER'?`<input class="field" id="refNo" placeholder="شماره پیگیری، اختیاری">`:''}</div>
<div class="checkout-section"><button class="text-link" id="toggleDiscount">${discountLabel()}</button><div id="discountFields" class="${state.discountOpen||state.discount?'':'hidden'}"><div class="segments" style="grid-template-columns:1fr 1fr"><button data-disctype="amount" class="${state.discountType==='amount'?'active':''}">مبلغ</button><button data-disctype="percent" class="${state.discountType==='percent'?'active':''}">درصد</button></div><div class="discount-input-wrap"><input class="field" id="discountValue" inputmode="${state.discountType==='percent'?'decimal':'numeric'}" placeholder="مقدار تخفیف" value="${state.discount||''}">${state.discountType==='percent'?'<span class="discount-suffix">٪</span>':''}</div><div id="discountApproval">${discountApprovalHtml()}</div></div></div>
${totalsHtml(t)}`}
function deliverySectionHtml(){return `<div class="checkout-section" id="deliverySection"><div class="row-title"><div class="bubble"><span class="icon" data-icon="truck"></span></div><div><strong>تحویل</strong><small>روش تحویل را انتخاب کنید</small></div></div><div class="segments"><button type="button" data-delivery="IMMEDIATE" class="${state.delivery==='IMMEDIATE'?'active':''}">همین الان</button><button type="button" data-delivery="SHIP" class="${state.delivery==='SHIP'?'active':''}">ارسال</button><button type="button" data-delivery="PICKUP" class="${state.delivery==='PICKUP'?'active':''}">تحویل در مزون</button></div>${state.delivery==='SHIP'?`<input class="field" id="address" placeholder="آدرس ارسال" value="${state.address||state.customer?.address||''}"><select class="field" id="carrier"><option ${state.carrier==='پیک'?'selected':''}>پیک</option><option ${state.carrier==='پست'?'selected':''}>پست</option><option ${state.carrier==='روش دیگر'?'selected':''}>روش دیگر</option></select>`:''}</div>`}
function discountLabel(){return state.discount?`تخفیف: ${state.discountType==='percent'?fmt(state.discount)+'٪':toman(state.discount)}`:'+ افزودن تخفیف'}
function discountApprovalHtml(){return state.discountType==='percent'&&state.discount>10&&!state.managerApproved?'<button class="btn btn-secondary" id="managerApprove" style="width:100%;margin-top:7px">تأیید مدیر برای تخفیف بالای ۱۰٪</button>':''}
function totalsHtml(t){return `<div class="checkout-section totals" id="saleTotals"><div class="total-row"><span>جمع کالاها</span><strong>${toman(t.subtotal)}</strong></div>${t.discount?`<div class="total-row"><span>تخفیف</span><strong>− ${toman(t.discount)}</strong></div>`:''}${t.balance?`<div class="total-row balance-row"><span>مانده پرداخت</span><strong>${toman(t.balance)}</strong></div>`:''}<div class="total-row final"><span>جمع کل</span><strong>${toman(t.total)}</strong></div></div>`}
function submitText(t){if(!state.cart.length)return'ابتدا کالا اضافه کنید';if(state.discountType==='percent'&&state.discount>10&&!state.managerApproved)return'نیاز به تأیید مدیر';return t.balance?`ثبت سفارش · ${toman(t.balance)} مانده`:`ثبت فروش · ${toman(t.total)}`}
function refreshSaleTotals(r=document){const t=totals(),current=$('#saleTotals',r);if(current)current.outerHTML=totalsHtml(t);const label=$('#toggleDiscount',r);if(label)label.textContent=discountLabel();const approval=$('#discountApproval',r);if(approval){approval.innerHTML=discountApprovalHtml();$('#managerApprove',approval)?.addEventListener('click',()=>managerApprove(r.id==='sheetHost'))}const text=submitText(t),btn=$('#submitSale',r),sheetBtn=$('#sheetSubmit',r);if(btn)btn.textContent=text;if(sheetBtn)sheetBtn.textContent=text;renderMobileSaleBar()}
function renderMobileSaleBar(){const bar=$('#mobileSaleBar');if(state.page!=='sale'||!state.cart.length){bar.className='mobile-sale-summary empty';bar.innerHTML='';return}const t=totals(),count=state.cart.reduce((a,i)=>a+i.qty,0);bar.className='mobile-sale-summary';bar.innerHTML=`<div class="sum-info"><strong>${fmt(count)} کالا در سبد</strong><small>${toman(t.total)}</small></div><button class="btn btn-primary" id="openCartMobile">سبد و تسویه <span class="icon" data-icon="chevron"></span></button>`;$('#openCartMobile').onclick=openMobileCheckout;injectIcons()}
function resetSaleFilters(){state.query='';state.category='همه';state.colorFilter='همه';state.sizeFilter='همه';rerenderSale()}
function saleFilteredProducts(){const q=state.query.trim().toLowerCase();return activeBrandProducts().filter(p=>(state.category==='همه'||p.cat===state.category)&&(state.colorFilter==='همه'||p.colors.some(c=>c.name===state.colorFilter))&&(state.sizeFilter==='همه'||p.colors.some(c=>Number(c.sizes[state.sizeFilter]||0)>0))&&(!q||`${p.name} ${p.code} ${p.cat}`.toLowerCase().includes(q)))}
function refreshSaleCatalog(r=document){const ps=saleFilteredProducts(),grid=$('#saleProductGrid',r),count=$('#saleResultCount',r),landing=$('#categoryLanding',r),view=$('#saleProductView',r),showCategories=state.category==='همه'&&state.colorFilter==='همه'&&state.sizeFilter==='همه'&&!state.query.trim();landing?.classList.toggle('hidden',!showCategories);view?.classList.toggle('hidden',showCategories);if(count)count.textContent=`${fmt(ps.length)} کالا`;if(grid){grid.innerHTML=ps.map(productCard).join('')||'<div class="card catalog-empty">کالایی با این فیلتر پیدا نشد.<button class="text-link" id="emptyReset">نمایش همه کالاها</button></div>';$$('[data-pick-product]',grid).forEach(b=>b.onclick=()=>openVariantPicker(b.dataset.pickProduct));$('#emptyReset',grid)?.addEventListener('click',resetSaleFilters);injectIcons()}}
function wireSale(r){const search=$('#productSearch',r);search.oninput=e=>{state.query=e.target.value;refreshSaleCatalog(r)};$('#categoryFilter',r)?.addEventListener('change',e=>{state.category=e.target.value;refreshSaleCatalog(r)});$('#colorFilter',r)?.addEventListener('change',e=>{state.colorFilter=e.target.value;refreshSaleCatalog(r)});$('#sizeFilter',r)?.addEventListener('change',e=>{state.sizeFilter=e.target.value;refreshSaleCatalog(r)});$$('[data-sale-category]',r).forEach(b=>b.onclick=()=>{state.category=b.dataset.saleCategory;$('#categoryFilter',r).value=state.category;refreshSaleCatalog(r);window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})});$('#manageSaleCategories',r)?.addEventListener('click',()=>openWarehouseCatalog('categories'));$('#backToCategories',r)?.addEventListener('click',()=>{state.category='همه';state.colorFilter='همه';state.sizeFilter='همه';$('#categoryFilter',r).value='همه';$('#colorFilter',r).value='همه';$('#sizeFilter',r).value='همه';refreshSaleCatalog(r)});$('#resetSaleFilters',r)?.addEventListener('click',resetSaleFilters);$('#emptyReset',r)?.addEventListener('click',resetSaleFilters);$('#scanProduct',r)?.addEventListener('click',()=>toast('بارکد را در کادر جستجو وارد یا اسکن کنید.'));$$('[data-pick-product]',r).forEach(b=>b.onclick=()=>openVariantPicker(b.dataset.pickProduct));wireCheckout(r)}
function refreshDelivery(r){const old=$('#deliverySection',r);if(!old)return;old.outerHTML=deliverySectionHtml();wireDelivery(r);injectIcons()}
function wireDelivery(r){$$('[data-delivery]',r).forEach(b=>b.onclick=()=>{state.delivery=b.dataset.delivery;if(state.delivery==='SHIP'&&state.customer?.address&&!state.address)state.address=state.customer.address;refreshDelivery(r)});$('#address',r)?.addEventListener('input',e=>state.address=e.target.value);$('#carrier',r)?.addEventListener('change',e=>state.carrier=e.target.value)}
function refreshDiscountControls(r){$$('[data-disctype]',r).forEach(b=>b.classList.toggle('active',b.dataset.disctype===state.discountType));const wrap=$('.discount-input-wrap',r),input=$('#discountValue',r);if(wrap&&input){input.inputMode=state.discountType==='percent'?'decimal':'numeric';wrap.querySelector('.discount-suffix')?.remove();if(state.discountType==='percent')wrap.insertAdjacentHTML('beforeend','<span class="discount-suffix">٪</span>')}refreshSaleTotals(r)}
function wireCheckout(r=document){$$('[data-qty]',r).forEach(b=>b.onclick=e=>{e.preventDefault();const parts=b.dataset.qty.split('|'),d=Number(parts.pop()),key=parts.join('|');changeQty(key,d,r)});$$('[data-remove]',r).forEach(b=>b.onclick=e=>{e.preventDefault();state.cart=state.cart.filter(i=>i.key!==b.dataset.remove);rerenderCheckoutContext(r)});$('#clearCart',r)?.addEventListener('click',()=>{state.cart=[];rerenderCheckoutContext(r)});$('#chooseCustomer',r)?.addEventListener('click',()=>openCustomerSheet(r.id==='sheetHost'));$('#clearCustomer',r)?.addEventListener('click',()=>{state.customer=null;rerenderCheckoutContext(r)});wireDelivery(r);$$('[data-pay]',r).forEach(b=>b.onclick=()=>{state.payment=b.dataset.pay;state.paid=null;rerenderCheckoutContext(r)});$('#paidAmount',r)?.addEventListener('input',e=>{state.paid=localizedNumber(e.target.value);refreshSaleTotals(r)});$('#toggleDiscount',r)?.addEventListener('click',()=>{const f=$('#discountFields',r);state.discountOpen=f.classList.contains('hidden');f.classList.toggle('hidden',!state.discountOpen);if(state.discountOpen)setTimeout(()=>$('#discountValue',r)?.focus(),50)});$$('[data-disctype]',r).forEach(b=>b.onclick=()=>{state.discountType=b.dataset.disctype;state.discount=0;state.discountOpen=true;state.managerApproved=false;const input=$('#discountValue',r);if(input)input.value='';refreshDiscountControls(r);input?.focus()});$('#discountValue',r)?.addEventListener('input',e=>{const value=state.discountType==='percent'?localizedDecimal(e.target.value):localizedNumber(e.target.value),subtotal=totals().subtotal;state.discount=state.discountType==='percent'?Math.min(100,value):Math.min(subtotal,value);state.discountOpen=true;state.managerApproved=false;if(value>100&&state.discountType==='percent')e.target.value='100';refreshSaleTotals(r)});$('#managerApprove',r)?.addEventListener('click',()=>managerApprove(r.id==='sheetHost'));$('#submitSale',r)?.addEventListener('click',()=>validateSubmit(r.id==='sheetHost'))}
function rerenderSale(){if(state.page==='sale'){renderSale($('#pageRoot'));renderMobileSaleBar();injectIcons()}}
function rerenderCheckoutContext(r){rerenderSale();if(r!==document&&r.id==='sheetHost'&&$('.sheet',r))openMobileCheckout()}
function addItem(pid,color,size){const p=data.products.find(x=>x.id===pid),c=p.colors.find(x=>x.name===color),stock=available(p,c,size),key=`${pid}|${color}|${size}`;const existing=state.cart.find(i=>i.key===key);if(existing){if(existing.qty>=stock)return toast('بیشتر از موجودی قابل فروش نیست.');existing.qty++}else state.cart.push({key,pid,name:p.name,code:p.code,color,size,price:p.price,qty:1});rerenderSale();toast('به فروش اضافه شد.')}
function changeQty(key,d,r=document){const i=state.cart.find(x=>x.key===key);if(!i)return;const p=data.products.find(x=>x.id===i.pid),c=p.colors.find(x=>x.name===i.color),stock=available(p,c,i.size);if(d>0&&i.qty>=stock)return toast('بیشتر از موجودی قابل فروش نیست.');i.qty+=d;if(i.qty<=0)state.cart=state.cart.filter(x=>x.key!==key);rerenderCheckoutContext(r)}
function managerApprove(returnToCheckout=false){openSheet(`<h3>تأیید مدیر</h3><p style="font-size:10px;color:var(--sub)">برای نمونه اولیه، تأیید اینجا ثبت می‌شود. در نسخه عملیاتی به نقش مدیر متصل خواهد شد.</p><button class="btn btn-primary" style="width:100%" id="confirmManager">تأیید تخفیف</button>`,host=>$('#confirmManager',host).onclick=()=>{state.managerApproved=true;if(returnToCheckout)openMobileCheckout();else{closeSheet();rerenderSale()}toast('تخفیف تأیید شد.')})}
function openCustomerSheet(returnToCheckout=false){const rows=data.customers.map(c=>`<button class="sheet-row" data-customer="${c.id}"><div><strong>${c.name}</strong><small class="ltr">${c.phone}</small></div><span class="icon" data-icon="chevron"></span></button>`).join('');openSheet(`<h3>انتخاب مشتری</h3><input class="field" id="customerQ" placeholder="نام یا شماره موبایل"><div class="sheet-list" id="customerRows">${rows}</div><button class="btn btn-secondary" style="width:100%;margin-top:10px" id="newCustomer">+ مشتری جدید</button>`,host=>{$$('[data-customer]',host).forEach(b=>b.onclick=()=>{state.customer=data.customers.find(c=>c.id===b.dataset.customer);if(state.delivery==='SHIP'&&state.customer.address)state.address=state.customer.address;if(returnToCheckout)openMobileCheckout();else{closeSheet();rerenderSale()}});$('#customerQ',host).oninput=e=>$$('[data-customer]',host).forEach(b=>{const c=data.customers.find(x=>x.id===b.dataset.customer);b.style.display=`${c.name} ${c.phone}`.includes(e.target.value)?'flex':'none'});$('#newCustomer',host).onclick=()=>newCustomerForm()})}
function newCustomerForm(){openSheet(`<h3>مشتری جدید</h3><input class="field" id="ncName" placeholder="نام و نام خانوادگی"><input class="field ltr" id="ncPhone" inputmode="tel" placeholder="09xxxxxxxxx"><input class="field" id="ncAddress" placeholder="آدرس، اختیاری"><button class="btn btn-primary" style="width:100%;margin-top:10px" id="saveCustomer">ذخیره مشتری</button>`,host=>$('#saveCustomer',host).onclick=()=>{const name=$('#ncName',host).value.trim(),phone=normalizeDigits($('#ncPhone',host).value).replace(/\D/g,''),address=$('#ncAddress',host).value.trim();if(!name||phone.length<10)return toast('نام و شماره موبایل را کامل کنید.');const exists=data.customers.find(c=>c.phone===phone);if(exists){state.customer=exists;closeSheet();rerenderSale();return toast('این شماره قبلاً ثبت شده بود؛ همان مشتری انتخاب شد.')}const c={id:uid('c'),name,phone,address};data.customers.unshift(c);state.customer=c;save();closeSheet();rerenderSale();toast('مشتری ذخیره شد.')})}
function validateSubmit(returnToCheckout=false){if(!state.cart.length)return toast('سبد فروش خالی است.');if(state.delivery==='SHIP'&&!state.customer)return toast('برای سفارش ارسالی مشتری را انتخاب کنید.');if(state.delivery==='SHIP'&&!(state.address||state.customer?.address))return toast('آدرس ارسال را وارد کنید.');if(state.discountType==='percent'&&state.discount>10&&!state.managerApproved)return managerApprove(returnToCheckout);for(const i of state.cart){const p=data.products.find(x=>x.id===i.pid),c=p.colors.find(x=>x.name===i.color);if(available(p,c,i.size)<i.qty)return toast(`${i.name} سایز ${i.size} دیگر موجود نیست.`)}openFinalConfirmation(returnToCheckout)}
function openFinalConfirmation(returnToCheckout=false){const t=totals(),items=state.cart.map(i=>`<div class="receipt-row"><span>${i.name}<small class="receipt-detail">${i.color} · سایز ${fmt(i.size)} · ${fmt(i.qty)} عدد</small></span><strong>${toman(i.price*i.qty)}</strong></div>`).join('');openSheet(`<div class="final-confirm"><h3>تأیید نهایی فروش</h3><p>اطلاعات را بررسی کنید؛ موجودی فقط پس از تأیید نهایی کم می‌شود.</p><div class="receipt final-items">${items}</div><div class="receipt"><div class="receipt-row"><span>مشتری</span><strong>${state.customer?.name||'فروش حضوری'}</strong></div><div class="receipt-row"><span>تحویل</span><strong>${deliveryFa(state.delivery)}</strong></div><div class="receipt-row"><span>پرداخت</span><strong>${paymentFa(state.payment)}</strong></div>${t.discount?`<div class="receipt-row"><span>تخفیف${state.discountType==='percent'?` (${fmt(state.discount)}٪)`:''}</span><strong>− ${toman(t.discount)}</strong></div>`:''}<div class="receipt-row"><span>مبلغ نهایی</span><strong>${toman(t.total)}</strong></div></div><div class="final-actions"><button class="btn btn-outline" id="cancelFinalSale">بازگشت و ویرایش</button><button class="btn btn-primary" id="confirmFinalSale">تأیید و ثبت نهایی</button></div></div>`,host=>{$('#cancelFinalSale',host).onclick=()=>returnToCheckout?openMobileCheckout():closeSheet();$('#confirmFinalSale',host).onclick=()=>{closeSheet();commitSale()}})}
function commitSale(){const t=totals(),createdAt=new Date().toISOString(),id=`S-${new Date().getFullYear().toString().slice(-2)}${String(new Date().getMonth()+1).padStart(2,'0')}-${String(orders.length+1).padStart(5,'0')}`;for(const i of state.cart){const p=data.products.find(x=>x.id===i.pid),c=p.colors.find(x=>x.name===i.color);c.sizes[i.size]-=i.qty;inventoryMoves.unshift({id:uid('im'),type:'SALE',productId:p.id,productName:p.name,color:c.name,size:i.size,qty:-i.qty,reference:id,createdAt})}const paymentStatus=state.payment==='CARD_TRANSFER'?'نیاز به تأیید':t.balance?'ناقص':'تسویه';const fulfillmentStatus=state.delivery==='IMMEDIATE'?'تحویل شد':state.delivery==='PICKUP'?'آماده تحویل در مزون':'آماده‌سازی';const o={id,brand:state.brand,createdAt,customer:state.customer?{...state.customer}:null,items:structuredClone(state.cart),subtotal:t.subtotal,discount:t.discount,total:t.total,paid:t.paid,balance:t.balance,payment:state.payment,paymentStatus,delivery:state.delivery,address:state.delivery==='SHIP'?(state.address||state.customer?.address||''):'',carrier:state.delivery==='SHIP'?state.carrier:'',fulfillmentStatus};orders.unshift(o);if(state.delivery==='SHIP')tasks.unshift({id:uid('t'),brand:state.brand,title:`آماده‌سازی ${id} برای ${state.customer?.name||'مشتری'}`,done:false,due:'امروز'});if(t.balance)tasks.unshift({id:uid('t'),brand:state.brand,title:`پیگیری مانده ${toman(t.balance)} سفارش ${id}`,done:false,due:'امروز'});if(paymentStatus==='نیاز به تأیید')tasks.unshift({id:uid('t'),brand:state.brand,title:`تأیید کارت‌به‌کارت سفارش ${id}`,done:false,due:'امروز'});state.lastOrder=o;save();showSuccess(o);resetSale(false);renderMobileSaleBar();updateBadges()}

function receiptText(o){return [`رسید فروش CRM هالین`,`شماره سفارش: ${o.id}`,`تاریخ: ${new Date(o.createdAt).toLocaleString('fa-IR')}`,`مشتری: ${o.customer?.name||'فروش حضوری'}`,`شماره تماس: ${o.customer?.phone||'-'}`,'',...o.items.map(i=>`${i.name} | ${i.color} | سایز ${fmt(i.size)} | ${fmt(i.qty)} عدد | ${toman(i.price*i.qty)}`),'',`جمع کالاها: ${toman(o.subtotal)}`,`تخفیف: ${toman(o.discount)}`,`مبلغ نهایی: ${toman(o.total)}`,`پرداخت: ${paymentFa(o.payment)} - ${o.paymentStatus}`,`تحویل: ${deliveryFa(o.delivery)}`,o.address?`آدرس: ${o.address}`:''].filter(Boolean).join('\n')}
async function shareReceipt(o){const text=receiptText(o),title=`رسید ${o.id}`;try{if(navigator.share){await navigator.share({title,text});return}if(navigator.clipboard){await navigator.clipboard.writeText(text);toast('متن رسید کپی شد.');return}}catch(e){if(e.name==='AbortError')return}const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${o.id}-receipt.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('فایل رسید دانلود شد.')}
function showSuccess(o){const next=o.delivery==='SHIP'?'آماده‌سازی سفارش برای ارسال':o.paymentStatus==='نیاز به تأیید'?'تأیید پرداخت کارت‌به‌کارت':o.balance?'پیگیری مانده پرداخت':'';$('#successHost').innerHTML=`<div class="success-overlay"><div class="success-card"><div class="success-check"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12 4 4 10-10"/></svg></div><h2>فروش ثبت شد</h2><p>سفارش شما با موفقیت ثبت شد.</p><div class="receipt"><div class="receipt-row"><span>شماره سفارش</span><strong class="ltr">${o.id}</strong></div><div class="receipt-row"><span>مشتری</span><strong>${o.customer?.name||'فروش حضوری'}</strong></div><div class="receipt-row"><span>جمع کل</span><strong>${toman(o.total)}</strong></div><div class="receipt-row"><span>پرداخت</span><strong>${o.paymentStatus}${o.balance?` · ${toman(o.balance)} مانده`:''}</strong></div><div class="receipt-row"><span>تحویل</span><strong>${deliveryFa(o.delivery)}</strong></div></div>${next?`<div class="next-action"><strong>اقدام بعدی</strong><small>${next}</small></div>`:''}<div class="success-actions"><button class="btn btn-outline" id="viewOrder">مشاهده سفارش</button><button class="btn btn-outline" id="sendReceipt">ارسال رسید</button><button class="btn btn-outline" id="homeSuccess">بازگشت به صفحه اصلی</button><button class="btn btn-primary primary-full" id="newSaleSuccess">فروش جدید</button></div></div></div>`;$('#viewOrder').onclick=()=>{closeSuccess();setPage('orders')};$('#sendReceipt').onclick=()=>shareReceipt(o);$('#homeSuccess').onclick=()=>{closeSuccess();setPage('today')};$('#newSaleSuccess').onclick=()=>{closeSuccess();setPage('sale')}}

const GOOGLE_BACKUP_SCRIPT=`function doPost(e) {
  const payload = JSON.parse(e.postData.contents);
  if (payload.token !== ${JSON.stringify(backupConfig.token)}) return ContentService.createTextOutput('forbidden');
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  Object.keys(payload.tables).forEach(function(name) {
    const rows = payload.tables[name];
    let sheet = ss.getSheetByName(name);
    if (!sheet) sheet = ss.insertSheet(name);
    sheet.clearContents();
    if (rows.length) sheet.getRange(1, 1, rows.length, rows[0].length).setValues(rows);
    sheet.setFrozenRows(1);
  });
  PropertiesService.getDocumentProperties().setProperty('LAST_CRM_BACKUP', payload.exportedAt);
  return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
}`;

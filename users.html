<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کاربران | CRM مزون هاله</title><link rel="stylesheet" href="./login.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--login-bg,#f7f7f9)}.users-card{width:min(100%,520px);padding:28px;border:1px solid var(--login-line,#e7e7ec);border-radius:24px;background:var(--login-surface,#fff);box-shadow:0 16px 50px #1111}.users-card h1{margin:0;font-size:27px}.users-card p{color:var(--login-sub,#6f717b)}.users-card label{display:block;margin-top:17px;font-weight:700}.users-card input{width:100%;margin-top:7px;min-height:48px;border:1px solid var(--login-line,#e7e7ec);border-radius:12px;padding:10px;font:inherit}.users-card button{width:100%;margin-top:22px;min-height:50px;border:0;border-radius:13px;background:#6244ce;color:#fff;font:inherit;font-weight:800}.users-card a{display:block;text-align:center;margin-top:16px;color:#6244ce}.status{min-height:24px;margin-top:12px;color:#c64848}.hidden{display:none!important}</style></head>
<body><main class="users-card" id="adminPanel"><h1>افزودن کاربر</h1><p>این بخش فقط برای ادمین مزون در دسترس است.</p><form id="userForm"><label>نام کاربر<input id="staffName" required autocomplete="name"></label><label>شماره موبایل<input id="staffPhone" required inputmode="numeric" placeholder="۰۹۱۲۱۲۳۴۵۶۷"></label><label>رمز موقت<input id="staffPassword" required type="password" minlength="8" autocomplete="new-password"></label><p class="status" id="userStatus" role="alert"></p><button>ساخت کاربر</button></form><a href="./index.html#/today">بازگشت به مزون</a></main><script type="module" src="./users.js"></script></body></html>
